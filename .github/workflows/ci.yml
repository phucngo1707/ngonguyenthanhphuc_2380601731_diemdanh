name: PRIME Attendance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: DB_NgoNguyenThanhPhuc_2380601731_PrimeAttendance
          MYSQL_USER: prime_user
          MYSQL_PASSWORD: prime_secure_password_2026
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Generate Prisma Client & Run Migrations
        working-directory: ./api
        env:
          DATABASE_URL: mysql://prime_user:prime_secure_password_2026@127.0.0.1:3306/DB_NgoNguyenThanhPhuc_2380601731_PrimeAttendance
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run Backend Tests
        working-directory: ./api
        env:
          DATABASE_URL: mysql://prime_user:prime_secure_password_2026@127.0.0.1:3306/DB_NgoNguyenThanhPhuc_2380601731_PrimeAttendance
          JWT_ACCESS_SECRET: test_secret_access_12345
          JWT_REFRESH_SECRET: test_secret_refresh_12345
          QR_SIGNING_SECRET: test_qr_secret_12345
          ENABLE_DEMO_ACCOUNTS: true
          DEMO_FIXED_OTP: 170723
        run: npm test

  flutter-analyze:
    name: Flutter Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos
