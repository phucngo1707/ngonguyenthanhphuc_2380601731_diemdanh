services:
  mysql:
    image: mysql:8.0.36
    container_name: prime_attendance_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password_2026
      MYSQL_DATABASE: DB_NgoNguyenThanhPhuc_2380601731_PrimeAttendance
      MYSQL_USER: prime_user
      MYSQL_PASSWORD: prime_secure_password_2026
    ports:
      - "3306:3306"
    volumes:
      - prime_mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "prime_user", "-pprime_secure_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prime_mysql_data:
    name: prime_attendance_mysql_data
